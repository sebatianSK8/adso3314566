<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>07-class-vehicle</title>
  <link rel="stylesheet" href="../src/css/04-js.css" />
  <style>
    /* =====================================================
       AJUSTES GENERALES
    ====================================================== */
    .content-section { height: fit-content !important; overflow-y: visible !important; }
    main { max-height: fit-content; }
    body { overflow-y: scroll; background-color: #f0f0f0; }

    /* =====================================================
       VEHICLE
    ====================================================== */
    div.vehicle {
      margin-left: auto;
      margin-right: auto;
      width: 412px;
      min-height: 870px;
      padding: 1rem;
      border-radius: 15px;
      background-color: #020207;
      border: 1px solid #292431;
      overflow: hidden;
      color: white;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* MODO OSCURO */
    div.vehicle.dark { background-color: #020207; border-color: #292431; color: white; }

    /* MODO CLARO */
    div.vehicle:not(.dark) { background-color: #f3f2f7; border-color: #d8d4e3; color: #17151d; }
    div.vehicle:not(.dark) figure.brand,
    div.vehicle:not(.dark) .vehicle-info figure,
    div.vehicle:not(.dark) .vehicle-controls button,
    div.vehicle:not(.dark) button.mode,
    div.vehicle:not(.dark) nav button { background-color: #ffffff; color: #17151d; }
    div.vehicle:not(.dark) .info-value,
    div.vehicle:not(.dark) .control-label { color: #17151d; }
    div.vehicle:not(.dark) .info-label,
    div.vehicle:not(.dark) .vehicle-status { color: #6f6a78; }

    /* =====================================================
       HEADER
    ====================================================== */
    div.vehicle header.vehicle-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 80px;
      padding-left: 0;       /* ← Sin padding a la izquierda para que el logo llegue al borde */
    }

    /* LOGO NASCAR - ALINEADO A LA IZQUIERDA */
    div.vehicle figure.logo {
      width: 250px;
      height: 75px;
      margin: 0;
      margin-left: -10px;          /* ← Lo empuja un poco más a la izquierda */
      border: none;
      border-radius: 0;
      background-color: transparent;
      background-image: url("../src/imgs/vehicles/log.svg");
      background-repeat: no-repeat;
      background-position: left center;   /* ← ¡CLAVE! Alinea el logo a la izquierda */
      background-size: contain;
      box-shadow: none;
      transition: filter 0.3s ease;
    }

    /* LOGO en modo CLARO: invertimos colores */
    div.vehicle:not(.dark) figure.logo {
      background-color: transparent;
      background-image: url("../src/imgs/vehicles/log.svg");
      border: none;
      box-shadow: none;
      background-position: left center;   /* ← Mantiene la alineación a la izquierda */
      filter: invert(1) hue-rotate(180deg);
    }

    /* BOTÓN MODE */
    div.vehicle button.mode {
      width: auto; padding: 0 12px; height: 43px; margin: 0; border: none; border-radius: 8px;
      background-color: transparent; color: inherit; cursor: pointer; font-size: 14px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.3s;
    }
    div.vehicle button.mode:hover { background-color: rgba(176, 38, 255, 0.1); }
    .mode-icon { color: #b026ff; font-size: 20px; }
    div.vehicle:not(.dark) .mode-icon { color: #ff2d95; }

    /* =====================================================
       NAVEGACIÓN
    ====================================================== */
    div.vehicle nav { display: grid; grid-template-columns: 56px 1fr 56px; gap: 16px; height: 58px; margin-top: 18px; }
    div.vehicle nav button {
      border: none; background-color: #111018; color: white; cursor: pointer; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.3s;
    }
    div.vehicle.dark nav button:hover { background-color: #191520; }
    div.vehicle.dark nav button:active { background-color: #191520; }
    div.vehicle:not(.dark) nav button { background-color: #ffffff; color: #17151d; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    div.vehicle:not(.dark) nav button:hover { background-color: #f0e6ff; color: #17151d; }
    div.vehicle:not(.dark) nav button:active { background-color: #f0e6ff; color: #17151d; }
    .arrow { color: #b026ff; font-size: 30px; line-height: 25px; }
    .nav-text { font-size: 11px; }

    /* MARCA */
    div.vehicle figure.brand {
      height: 58px; margin: 0; background-color: #111018; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; color: white;
    }
    div.vehicle:not(.dark) figure.brand { background-color: #ffffff; color: #17151d; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    div.vehicle figure.brand span { font-size: 16px; font-weight: 600; }

    /* INFO */
    .vehicle-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .vehicle-info figure {
      height: 85px; margin: 0; padding: 5px; background-color: #111018; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    div.vehicle:not(.dark) .vehicle-info figure { background-color: #ffffff; color: #17151d; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .vehicle-info figure img { width: 60px; height: 30px; object-fit: contain; }
    .info-label { color: #77727f; font-size: 13px; }
    .info-value { color: white; font-size: 13px; }

    /* =====================================================
       ESCENARIO CON PARALLAX
    ====================================================== */
    .race-scene {
      width: calc(100% + 32px);
      height: 220px;
      margin-left: -16px;
      margin-top: 18px;
      position: relative;
      overflow: hidden;
      background-color: #05091c;
      border-radius: 8px;
      transition: background-color 0.4s ease;
    }
    div.vehicle:not(.dark) .race-scene { background-color: #b8d8f0; }

    /* Capas del escenario */
    .race-scene .layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 100%;
      background-repeat: repeat-x;
      background-position: 0 bottom;
      background-size: contain;
      transition: background-position 0.1s linear, opacity 0.4s ease, filter 0.4s ease;
    }

    /* ---- Capa ROUTE ---- */
    .race-scene .route {
      background-image: url("../src/imgs/vehicles/escenarioNight.svg");
      z-index: 3;
      background-size: 120%;
      filter: brightness(0.5) contrast(1.2);
    }
    div.vehicle:not(.dark) .race-scene .route {
      background-image: url("../src/imgs/vehicles/escenarioLight.svg");
      filter: brightness(1) contrast(1);
    }

    /* =====================================================
       COCHE
    ====================================================== */
    .race-scene .car {
      position: absolute;
      width: 230px;
      height: 100px;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 5;
      transition: transform 0.5s ease;
      filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.6));
    }
    .race-scene .car img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
      mix-blend-mode: multiply;
      filter: brightness(1.6) saturate(1.3) contrast(1.1);
    }
    .race-scene .car.moving { animation: vibration 0.12s infinite alternate; }
    @keyframes vibration {
      from { margin-top: 0; }
      to { margin-top: -2px; }
    }
    .race-scene .car.forward { transform: translateX(calc(-50% + 10px)); }
    .race-scene .car.back { transform: translateX(calc(-50% - 10px)); }

    /* =====================================================
       CONTROLES
    ====================================================== */
    .vehicle-controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 28px; }
    .vehicle-controls button {
      height: 63px; border: none; background-color: #111018; color: white; cursor: pointer; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; transition: 0.25s;
    }
    div.vehicle:not(.dark) .vehicle-controls button { background-color: #ffffff; color: #17151d; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .vehicle-controls button:hover { background-color: #191520; }
    div.vehicle:not(.dark) .vehicle-controls button:hover { background-color: #f0e6ff; }
    .vehicle-controls button.active {
      background-color: #21122b;
      box-shadow: inset 0 0 0 1px #fffc54, 0 0 10px rgba(255, 252, 96, 0.25);
    }
    .control-icon { color: #b026ff; font-size: 24px; line-height: 24px; }
    div.vehicle:not(.dark) #on .control-icon { color: #39ff14; }
    div.vehicle:not(.dark) #forward .control-icon { color: #fff06b; }
    div.vehicle:not(.dark) #stop .control-icon { color: #ff2d95; }
    div.vehicle:not(.dark) #back .control-icon { color: #b026ff; }
    div.vehicle:not(.dark) #off .control-icon { color: #ff1744; }
    .control-label { font-size: 12px; color: white; }
    div.vehicle:not(.dark) .control-label { color: #17151d; }

    /* ESTADO */
    .vehicle-status { text-align: center; margin-top: 12px; font-size: 11px; color: #77727f; }

    /* RESPONSIVE */
    @media (max-width: 500px) {
      div.vehicle { width: 100%; max-width: 412px; }
    }
  </style>
</head>
<body>

<a href="../04-js/" class="btn-home">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="black" viewBox="0 0 256 256">
        <path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"/>
    </svg>
</a>

  <main>
    <header class="header">
      <h1>07-class-vehicle</h1>
      <h2>Create and manipulate a vehicle object with properties.</h2>
    </header>

    <section class="content-section">
      <div class="vehicle dark">

        <header class="vehicle-header">
          <figure class="logo"></figure>
          <button class="mode" id="mode">
            <span class="mode-icon" id="mode-icon">☼</span>
            <span id="mode-text">Mode</span>
          </button>
        </header>

        <nav>
          <button class="prev" id="prev">
            <span class="arrow">←</span>
            <span class="nav-text">Prev</span>
          </button>
          <figure class="brand">
            <span id="brand">CHEVROLET</span>
          </figure>
          <button class="next" id="next">
            <span class="arrow">→</span>
            <span class="nav-text">Next</span>
          </button>
        </nav>

        <div class="vehicle-info">
          <figure>
            <img src="../src/imgs/vehicles/Group 8.svg" alt="Model" />
            <span class="info-label">Model</span>
            <strong class="info-value" id="model">Chevrolet</strong>
          </figure>
          <figure>
            <img src="../src/imgs/vehicles/Refer.svg" alt="Refer" />
            <span class="info-label">Refer</span>
            <strong class="info-value" id="refer">Monte Carlo</strong>
          </figure>
          <figure>
            <img src="../src/imgs/vehicles/Color.svg" alt="Color" />
            <span class="info-label">Color</span>
            <strong class="info-value" id="color">Yellow</strong>
          </figure>
        </div>

        <!-- ESCENARIO CON CAPAS -->
        <div class="race-scene" id="race-scene">
          <div class="layer route"></div>
          <div class="car" id="car">
            <img id="car-image" src="../src/imgs/vehicles/Chevy.svg" alt="Chevrolet Vehicle" />
          </div>
        </div>

        <div class="vehicle-controls">
          <button id="on">
            <span class="control-icon">⏻</span>
            <span class="control-label">On</span>
          </button>
          <button id="forward">
            <span class="control-icon">▶▶</span>
            <span class="control-label">Forw</span>
          </button>
          <button id="stop">
            <span class="control-icon">▮▮</span>
            <span class="control-label">Stop</span>
          </button>
          <button id="back">
            <span class="control-icon">◀◀</span>
            <span class="control-label">Back</span>
          </button>
          <button id="off">
            <span class="control-icon">⏻</span>
            <span class="control-label">Off</span>
          </button>
        </div>

        <div class="vehicle-status" id="status">Vehicle OFF</div>
      </div>
    </section>
  </main>

  <script>
    /* =====================================================
       ELEMENTOS
    ====================================================== */
    const vhc = document.querySelector(".vehicle");
    const mode = document.querySelector("#mode");
    const modeIcon = document.querySelector("#mode-icon");
    const modeText = document.querySelector("#mode-text");
    const lbrand = document.querySelector("#brand");
    const lmodel = document.querySelector("#model");
    const lrefer = document.querySelector("#refer");
    const lcolor = document.querySelector("#color");
    const car = document.querySelector("#car");
    const carImage = document.querySelector("#car-image");
    const status = document.querySelector("#status");
    const raceScene = document.querySelector("#race-scene");
    const layers = document.querySelectorAll(".layer");

    const prev = document.querySelector("#prev");
    const next = document.querySelector("#next");
    const on = document.querySelector("#on");
    const forward = document.querySelector("#forward");
    const stop = document.querySelector("#stop");
    const back = document.querySelector("#back");
    const off = document.querySelector("#off");

    /* =====================================================
       ÍNDICE Y DATOS
    ====================================================== */
    let index = 0;

    const vehicles = {
      attrs: [
        {
          brand: "CHEVROLET",
          refer: "MONTE CARLO",
          model: "Chevrolet",
          color: "Yellow",
          image: "../src/imgs/vehicles/Chevy.svg"
        },
        {
          brand: "MCLAREN",
          refer: "SOLUS GT",
          model: "Mclaren",
          color: "Red",
          image: "../src/imgs/vehicles/solus.svg"
        },
        {
          brand: "FORD",
          refer: "GT",
          model: "Ford",
          color: "White",
          image: "../src/imgs/vehicles/ford.svg"
        }
      ]
    };

    /* =====================================================
       ESTADO DEL VEHÍCULO
    ====================================================== */
    let vehicleOn = false;
    let isPaused = true;
    let isReversed = false;
    let lastTimestamp = 0;

    /* =====================================================
       CLASE VEHICLE
    ====================================================== */
    class Vehicle {
      constructor(brand, refer, model, color, image) {
        this.brand = brand;
        this.refer = refer;
        this.model = model;
        this.color = color;
        this.image = image;
        this.displayData();
      }

      displayData() {
        lbrand.textContent = this.brand;
        lmodel.textContent = this.model;
        lrefer.textContent = this.refer;
        lcolor.textContent = this.color;
        carImage.src = this.image;
        carImage.alt = `${this.brand} ${this.model}`;
      }

      powerOn() {
        vehicleOn = true;
        status.textContent = "Vehicle ON";
        on.classList.add("active");
        off.classList.remove("active");
        vibrate();
      }

      powerOff() {
        vehicleOn = false;
        isPaused = true;
        isReversed = false;
        car.classList.remove("forward", "back", "moving");
        status.textContent = "Vehicle OFF";
        off.classList.add("active");
        on.classList.remove("active");
      }

      forward() {
        if (!vehicleOn) {
          status.textContent = "Turn the vehicle ON first";
          return;
        }
        isPaused = false;
        isReversed = false;
        lastTimestamp = 0;
        car.classList.remove("back");
        car.classList.add("forward", "moving");
        status.textContent = "Vehicle moving forward";
      }

      backward() {
        if (!vehicleOn) {
          status.textContent = "Turn the vehicle ON first";
          return;
        }
        isPaused = false;
        isReversed = true;
        lastTimestamp = 0;
        car.classList.remove("forward");
        car.classList.add("back", "moving");
        status.textContent = "Vehicle moving backward";
      }

      stop() {
        isPaused = true;
        car.classList.remove("forward", "back", "moving");
        status.textContent = "Vehicle stopped";
        stop.classList.add("active");
        setTimeout(() => stop.classList.remove("active"), 300);
      }
    }

    let currentVehicle = new Vehicle(
      vehicles.attrs[0].brand,
      vehicles.attrs[0].refer,
      vehicles.attrs[0].model,
      vehicles.attrs[0].color,
      vehicles.attrs[0].image
    );

    /* =====================================================
       MODO OSCURO/CLARO (cambia escenario y logo)
    ====================================================== */
    mode.addEventListener("click", function () {
      vhc.classList.toggle("dark");
      if (vhc.classList.contains("dark")) {
        modeIcon.textContent = "☼";
        modeText.textContent = "Mode";
      } else {
        modeIcon.textContent = "☾";
        modeText.textContent = "Mode";
      }
    });

    /* =====================================================
       CAMBIO DE VEHÍCULO
    ====================================================== */
    function changeVehicle() {
      currentVehicle = new Vehicle(
        vehicles.attrs[index].brand,
        vehicles.attrs[index].refer,
        vehicles.attrs[index].model,
        vehicles.attrs[index].color,
        vehicles.attrs[index].image
      );
      car.classList.remove("forward", "back", "moving");
      isPaused = true;
      isReversed = false;
      status.textContent = vehicleOn ? "Vehicle ON" : "Vehicle OFF";
    }

    next.addEventListener("click", function () {
      index++;
      if (index >= vehicles.attrs.length) index = 0;
      changeVehicle();
    });

    prev.addEventListener("click", function () {
      index--;
      if (index < 0) index = vehicles.attrs.length - 1;
      changeVehicle();
    });

    /* =====================================================
       BOTONES DE CONTROL
    ====================================================== */
    on.addEventListener("click", () => currentVehicle.powerOn());
    off.addEventListener("click", () => currentVehicle.powerOff());
    forward.addEventListener("click", () => currentVehicle.forward());
    back.addEventListener("click", () => currentVehicle.backward());
    stop.addEventListener("click", () => currentVehicle.stop());

    /* =====================================================
       VIBRACIÓN DEL COCHE
    ====================================================== */
    function vibrate() {
      if (!vehicleOn) return;
      carImage.style.transform = `translate(0, ${1 * Math.sin(Date.now() / 25)}px)`;
      requestAnimationFrame(vibrate);
    }

    /* =====================================================
       PARALLAX (MOVIMIENTO DEL ESCENARIO)
    ====================================================== */
    const speedFactors = [1.2, 1.8, 2.5];

    layers.forEach(layer => {
      layer.dataset.pos = "0";
    });

    function animateParallax(timestamp) {
      if (!isPaused) {
        const delta = timestamp - (lastTimestamp || timestamp);
        lastTimestamp = timestamp;

        layers.forEach((layer, i) => {
          let currentPos = (parseFloat(layer.dataset.pos) || 0) 
                           + speedFactors[i] 
                           * (isReversed ? delta : -delta);
          layer.style.backgroundPositionX = `${currentPos}px`;
          layer.dataset.pos = currentPos;
        });
      }
      requestAnimationFrame(animateParallax);
    }

    // Iniciar el bucle de animación
    requestAnimationFrame(animateParallax);
  </script>
</body>
</html>
