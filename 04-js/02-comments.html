<main>
    <header>
        <h1>02-comments</h1>
        <h2>
            Add comments to explain or annotate your code.
        </h2>
    </header>
    <section>
        <h3>Digital Time:</h3>
        <h2 id="time">00:00:00</h2>
    </section>
</main>
<script>
    // This a line comment 
    const time = document.getElementById('time');
    // Add some styles
    time.style.textAlign = 'center';
    time.style.zoom = '3.4';
    /*
    This is a block comment
    its used in multiple lines of code
    or inactive large partions of code  
    */

    // this is a interval time
    setInterval(function() {
        let today = new Date();
        let hours = today.getHours();
        let minutes = today.getMinutes();
        let seconds = today.getSeconds();

        time.textContent = `${hours}:${minutes}:${seconds}`

    }, 1000);

</script>
</body>
