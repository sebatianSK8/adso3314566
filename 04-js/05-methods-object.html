<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05-methods-object</title>
    <link rel="stylesheet" href="../src/css/04-js.css">
    <link rel="stylesheet" href="animate.min.css">
    <style>
        main section h3.pk-name {
            font-size: 2rem;
            text-align: center;
        }
        main section h4 {
            background-color: #fff9;
            color: #0009;
            border-radius: 4px;
            text-align: center;
            font-size: 1.6rem;
            margin: 0 auto;
            padding: 0.4rem 1rem;
            width: fit-content;
        }

        main section figure {
            background-repeat: no-repeat;
            padding: 0;
            display: flex;
            justify-content: center;
            margin: 0 auto;
            height: 192px;
            width: 202px;
        }
        main section figure.alive {
            background-position-x: 0px;
        }
        main section figure.attack {
            background-position-x: -202px;
        }
        main section figure.feed {
            background-position-x: -404px;
        }
        main section figure.dead {
            background-position-x: -608px;
        }
        main section div.actions {
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            width: 150px;
            button {
                background: #fff9;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                padding: 0.4rem 1rem;
                transition: transform 0.2s ease-in;
                &:hover {
                    transform: scale(1.2);
                }
            }
        }
    </style>
</head>
<body>
   <a href="../04-js/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="white" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg> </a>
    <main>
        <header>
            <h1>05 Methods Object</h1>
            <h2>Use methods to interact with objects.</h2>
        </header>
<section>
            <h3 class="pk-name"></h3>
            <h4 class="pk-hp"></h4>
            <figure class="pk-image animate__animated"></figure>
            <div class="actions">
                <button class="btn-attack">Attack 👊</button>
                <button class="btn-feed">Feed 🌱</button>
            </div>
        </section>
    </main>
    <script>
        // Elements
        const pkName = document.querySelector('.pk-name')
        const pkHp = document.querySelector('.pk-hp')
        const pkImage = document.querySelector('.pk-image')

        // Btns
        const btnAttack = document.querySelector('.btn-attack')
        const btnFeed = document.querySelector('.btn-feed')

        // Object
        const pokemon = {
            // attributes
            name: 'Snorlax',
            type: 'Normal',
            hp: 100,
            image: 'img/snorlax-sprite.png',
            status: 'alive',

            // methods
            render: function(){
                pkName.innerHTML = `${this.name} <small>[${this.type}]</small>`
                pkImage.style.backgroundImage = `url(${this.image})`
                this.updateHp('animate__rubberBand')
                this.updateStatus();
            },
            updateHp: function(fx) {
                pkHp.innerHTML = `HP: ${this.hp}`
                pkImage.classList.add(`${this.status}`, fx)
            },
            feed: function() {
                if(this.hp < 200)
                this.hp += 25;
                this.status = 'feed'
                pkImage.classList.remove('alive', 'attact', 'dead')
                this.updateHp('animate__rubberBand')
                this.updateStatus();
            },
            attack: function() {
                if(this.hp > 0) {
                this.hp -= 25;
                this.status = 'attack'
                pkImage.classList.remove('alive', 'feed', 'dead')
                this.updateHp('animate__rubberBand')
                this.updateStatus();
                }
            },
                        updateStatus: function() {
                setTimeout(() => {
                    pkImage.classList.remove('animate__rubberBand')
                }, 1200)
            },
            updateStatus: function() {
                setTimeout(() => {
                    pkImage.classList.remove('animate__rubberBand')
                }, 1200)
            }
        
        }
        pokemon.render();

        // Events
        btnFeed.addEventListener('click', function(){
            pokemon.feed();
        })

        btnAttack.addEventListener('click', function(){
            pokemon.attack();
        })
    </script>
</body>
</html>
