<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05-methods-object</title>
    <link rel="stylesheet" href="/src/css/04-js.css">
    <link rel="stylesheet" href="animate.min.css">
    <style>
        main section h3.pk-name {
            font-size: 2rem;
            text-align: center;
        }

        main section h4 {
            background-color: #fff9;
            color: #0009;
            border-radius: 4px;
            text-align: center;
            font-size: 1.6rem;
            margin: 0 auto;
            padding: .4rem 1rem;
            width: fit-content;
        }

        main section figure {
            background-repeat: no-repeat;
            padding: 0;
            display: flex;
            justify-content: center;
            margin: 0 auto;
            height: 192px;
            width: 202px;
        }

        figure.alive {
            background-position-x: 0;
        }

        figure.attack {
            background-position-x: -202px;
        }

        figure.feed {
            background-position-x: -404px;
        }

        figure.dead {
            background-position-x: -608px;
        }

        main section div.actions {
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            width: 170px;
        }

        .actions button {
            background: #fff9;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: .4rem 1rem;
            transition: .2s;
        }

        .actions button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
<a href="../04-js/" class="btn-home">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="black" viewBox="0 0 256 256">
        <path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"/>
    </svg>
</a>
<main>
<header>
    <h1>05 Methods Object</h1>
    <h2>Use methods to interact with objects.</h2>
</header>
<section>
    <h3 class="pk-name"></h3>
    <h4 class="pk-hp"></h4>
    <figure class="pk-image animate__animated"></figure>
    <div class="actions">
        <button class="btn-attack">Attack 👊</button>
        <button class="btn-feed">Feed 🌱</button>
    </div>
</section>
</main>
<script>
const pkName = document.querySelector(".pk-name");
const pkHp = document.querySelector(".pk-hp");
const pkImage = document.querySelector(".pk-image");
const btnAttack = document.querySelector(".btn-attack");
const btnFeed = document.querySelector(".btn-feed");
const pokemon = {
    name: "Snorlax",
    type: "Normal",
    hp: 100,
    image: "img/snorlax-sprite.png",
    status: "alive",
    render: function () {
        pkName.innerHTML = `${this.name} <small>[${this.type}]</small>`;
        pkImage.style.backgroundImage = `url(${this.image})`;
        this.updateHp("animate__rubberBand");
    },
    updateHp: function (fx) {
        pkHp.innerHTML = `HP: ${this.hp}`;
        pkImage.classList.remove(
            "alive",
            "attack",
            "feed",
            "dead",
            "animate__rubberBand",
            "animate__wobble",
            "animate__shakeY"
        );
        pkImage.classList.add(this.status);
        pkImage.classList.add(fx);
        this.updateStatus();
    },
    updateStatus: function () {
        setTimeout(() => {
            pkImage.classList.remove(
                "animate__rubberBand",
                "animate__wobble",
                "animate__shakeY"
            );
            if (this.hp > 0) {
                pkImage.classList.remove("attack", "feed");
                pkImage.classList.add("alive");
            }
        }, 1200);
    },
    feed: function () {
        if (this.hp <= 0) return;
        if (this.hp < 200) {
            this.hp += 25;
            if (this.hp > 200) {
                this.hp = 200;
            }
        }
        this.status = "feed";
        this.updateHp("animate__rubberBand");
    },
    attack: function () {
        if (this.hp <= 0) return;
        this.hp -= 25;
        if (this.hp <= 0) {
            this.hp = 0;
            this.status = "dead";
            this.updateHp("animate__shakeY");
            btnAttack.disabled = true;
            btnFeed.disabled = true;
            return;
        }
        this.status = "attack";
        this.updateHp("animate__wobble");
    },
    disableActions: function (button) {
        if (this.hp <= 0) return;
        button.style.pointerEvents = "none";
        button.style.opacity = ".4";

        setTimeout(() => {
            btnAttack.style.pointerEvents = "all";
            btnAttack.style.opacity = "1";
            btnFeed.style.pointerEvents = "all";
            btnFeed.style.opacity = "1";
        }, 1500);
    }
};

pokemon.render();
btnAttack.addEventListener("click", function () {
    pokemon.attack();
    pokemon.disableActions(this);
});

btnFeed.addEventListener("click", function () {
    pokemon.feed();
    pokemon.disableActions(this);
});
</script>
</body>
</html>
