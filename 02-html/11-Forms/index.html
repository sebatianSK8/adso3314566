<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>11-Forms</title>

    <style>
        body {
            background-color: #fff3e0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

    
        header {
            text-align: center;
            margin-top: 20px;
        }

        header h1 {
            color: #000000;
            margin-bottom: 5px;
        }

        header h2 {
            font-size: 16px;
            color: #000000;
        }

    
        .btn-home {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .btn-home:hover {
            background-color: #000000;
        }

        
        form {
            background-color: #ffc170;
            width: 400px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        label {
            font-weight: bold;
            color: #bf360c;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ffcc80;
            border-radius: 5px;
        }

        .opciones {
            margin-bottom: 15px;
        }

        .opciones label {
            font-weight: normal;
            margin-left: 5px;
            margin-right: 15px;
        }

        .opciones input {
            width: auto;
        }

        input[type="submit"], input[type="reset"] {
            background-color: #fb8c00;
            color: white;
            border: none;
            cursor: pointer;
        }

        input[type="submit"]:hover, input[type="reset"]:hover {
            background-color: #ef6c00;
        }

        fieldset {
            border: 2px solid #ffb74d;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        legend {
            color: #e65100;
            font-weight: bold;
        }

    
        .password-container {
            position: relative;
        }

        .toggle-btn {
            position: absolute;
            right: 10px;
            top: 35px;
            cursor: pointer;
            font-size: 14px;
            color: #e65100;
        }
    </style>
</head>

<body>


<a href="../index.html" class="btn-home">
  <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="black" viewBox="0 0 256 256">
    <path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"/>
</svg>
</a>


<header>
    <h1>11-Forms</h1>
    <h2>Creates interactive forms for user input.</h2>
</header>


<form action="procesar.php" method="post" autocomplete="on">

    <fieldset>
        <legend>Datos personales</legend>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>

        <label for="password">Contraseña:</label>
        <div class="password-container">
            <input type="password" id="password" name="password" required>
            <span class="toggle-btn" onclick="togglePassword()">👁</span>
        </div>

        <label for="email">Correo:</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@mail.com">

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" min="1" max="100">
    </fieldset>

    <fieldset>
        <legend>Preferencias</legend>

        <p><strong>Género:</strong></p>
        <div class="opciones">
            <input type="radio" id="masculino" name="genero" value="masculino">
            <label for="masculino">Masculino</label>

            <input type="radio" id="femenino" name="genero" value="femenino">
            <label for="femenino">Femenino</label>
        </div>

        <p><strong>Intereses:</strong></p>
        <div class="opciones">
            <input type="checkbox" id="deporte" name="intereses" value="deporte">
            <label for="deporte">Deporte</label>

            <input type="checkbox" id="musica" name="intereses" value="musica">
            <label for="musica">Música</label>

            <input type="checkbox" id="cine" name="intereses" value="cine">
            <label for="cine">Cine</label>
        </div>

        <label for="pais">País:</label>
        <select name="pais" id="pais" required>
            <option value="">Seleccione</option>
            <option value="mexico">México</option>
            <option value="colombia">Colombia</option>
            <option value="argentina">Argentina</option>
        </select>
    </fieldset>

    <label for="comentarios">Comentarios:</label>
    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Escribe aquí..."></textarea>

    <input type="submit" value="Enviar">
    <input type="reset" value="Limpiar">

</form>

<script>
function togglePassword() {
    const input = document.getElementById("password");
    const btn = document.querySelector(".toggle-btn");

    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "😑";
    } else {
        input.type = "password";
        btn.textContent = "👁";
    }
}
</script>

</body>
</html>
