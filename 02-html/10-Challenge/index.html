<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>10-Challenge</title>
<link rel="stylesheet" href="/src/css/02-html.css">

<style>
body {
    background:#2e2e2e;
    display:flex;
    flex-direction:column; /* 👈 clave */
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

table {
    border-collapse:collapse;
}

td {
    width:70px;
    height:70px;
    border:3px solid #ccc;
    text-align:center;
    font-size:22px;
}

header h1 {
    color:white;
    text-align:center;
    margin-bottom:20px;
}

.black { background:black; }
.gray  { background:#555; }

/* 👇 opcional: posición del botón home */
.btn-home {
    position:absolute;
    top:20px;
    left:20px;
}
</style>
</head>

<body>

<a href="../index.html" class="btn-home">
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="black" viewBox="0 0 256 256">
<path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"/>
</svg>
</a>

<header>
    <h1>10-Challenge</h1>
</header>

<table>

<!-- FILA 1 -->
<tr>
  <td class="light" colspan="4"></td>
  <td class="dark">😎</td>
  <td class="light" colspan="3"></td>
</tr>

<!-- FILA 2 -->
<tr>
  <td class="light" colspan="3"></td>
  <td class="dark">😎</td>
  <td class="dark" rowspan="2">😎</td>
  <td class="dark">😎</td>
  <td class="light" colspan="2"></td>
</tr>

<!-- FILA 3 -->
<tr>
  <td class="light" colspan="2"></td>
  <td class="dark">😎</td>
  <td class="light"></td>
  <td class="dark">😎</td>
  <td class="light" colspan="2"></td>
</tr>

<!-- FILA 4 -->
<tr>
  <td class="light" colspan="2"></td>
  <td class="dark">😎</td>
  <td class="dark" colspan="3">😎</td>
  <td class="dark">😎</td>
  <td class="light"></td>
</tr>

<!-- FILA 5 -->
<tr>
  <td class="light"></td>
  <td class="dark">😎</td>
  <td class="dark" colspan="4">😎</td>
  <td class="dark">😎</td>
  <td class="light"></td>
</tr>

<!-- FILA 6 -->
<tr>
  <td class="light" colspan="2"></td>
  <td class="light"></td>
  <td class="dark">😎</td>
  <td class="dark">😎</td>
  <td class="dark">😎</td>
  <td class="light" colspan="2"></td>
</tr>

<!-- FILA 7 -->
<tr>
  <td class="light" colspan="3"></td>
  <td class="dark">😎</td>
  <td class="light"></td>
  <td class="dark">😎</td>
  <td class="light" colspan="2"></td>
</tr>

<!-- FILA 8 -->
<tr>
  <td class="light" colspan="4"></td>
  <td class="dark">😎</td>
  <td class="dark">😎</td>
  <td class="dark">😎</td>
  <td class="light"></td>
</tr>

<!-- FILA 9 -->
<tr>
  <td class="light" colspan="4"></td>
  <td class="light"></td>
  <td class="dark">😎</td>
  <td class="light"></td>
  <td class="light"></td>
</tr>

</table>

</body>
</html>
