<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>17-FinalChallenge</title>
<link rel="stylesheet" href="/src/css/02-html.css">

<style>
body {
    background-color: #2e2e2e;
    font-family: Arial, sans-serif;
    margin: 0;
    display: block !important;
}

header {
    text-align: center;
    margin-top: 20px;
}

header h1 {
    color: #ffffff;
}

header h2 {
    color: #cccccc;
}

.btn-home {
    position: absolute;
    top: 20px;
    left: 20px;
    background-color: #ffffff;
    padding: 10px;
    border-radius: 50%;
}

.table-container {
    display: flex;
    justify-content: center;
    margin-top: 40px;
}

table {
    border-collapse: collapse;
}

td {
    width: 70px;
    height: 70px;
    border: 3px solid white;
    text-align: center;
    font-size: 25px;
}

.black {
    background-color: black;
}

.gray {
    background-color: #888;
}
</style>
</head>

<body>

<a href="../index.html" class="btn-home">
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="black" viewBox="0 0 256 256">
<path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"/>
</svg>
</a>

<header>
    <h1>17-FinalChallenge</h1>
    <h2>Reto Final</h2>
</header>

<div class="table-container">
<table>

<tr>
    <td colspan="4" class="gray"></td>
    <td class="black">🛹</td>
    <td colspan="4" class="gray"></td>
</tr>

<tr>
    <td colspan="3" class="gray"></td>
    <td class="black">🛹</td>
    <td rowspan="3" class="black">🛹</td>
    <td class="black">🛹</td>
    <td colspan="3" class="gray"></td>
</tr>

<tr>
    <td colspan="2" class="gray"></td>
    <td class="black">🛹</td>
    <td class="gray"></td>
    <td class="black">🛹</td>
    <td colspan="3" class="gray"></td>
</tr>

<!-- 🔥 CORREGIDA -->
<tr>
    <td class="gray"></td>
    <td class="black">🛹</td>
    <td class="gray"></td>
    <td colspan="3" class="black">🛹</td>
    <td class="gray"></td>
    <td class="black">🛹</td>
    <td class="gray"></td>
</tr>

<!-- 🔥 CORREGIDA -->
<tr>
    <td class="gray"></td>
    <td class="black">🛹</td>
    <td colspan="5" class="black">🛹</td>
    <td class="black">🛹</td>
    <td class="gray"></td>
</tr>

<tr>
    <td colspan="2" class="gray"></td>
    <td class="black">🛹</td>
    <td colspan="3" class="black">🛹</td>
    <td class="black">🛹</td>
    <td colspan="2" class="gray"></td>
</tr>

<tr>
    <td colspan="3" class="gray"></td>
    <td class="black">🛹</td>
    <td class="gray"></td>
    <td class="black">🛹</td>
    <td colspan="3" class="gray"></td>
</tr>

<tr>
    <td colspan="4" class="gray"></td>
    <td class="black">🛹</td>
    <td class="black">🛹</td>
    <td class="black">🛹</td>
    <td colspan="2" class="gray"></td>
</tr>

<tr>
    <td colspan="4" class="gray"></td>
    <td class="black">🛹</td>
    <td colspan="4" class="gray"></td>
</tr>

</table>
</div>

</body>
</html>
