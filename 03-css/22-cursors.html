<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>22-cursors</title>

<!-- MISMAS RUTAS -->
<link rel="stylesheet" href="/src/css/03-css.css">

<style>

/* HEADER ARRIBA */
header {
    width: 100%;
    text-align: center;
    margin: 20px 0;
}

/* evitar conflictos con layout externo */
body {
    display: block !important;
}

/* CONTENEDOR */
.container {
    border: 2px solid #000;
    padding: 15px;
    margin: 20px;
}

/* CAJAS PARA DEMOSTRAR CURSORES */
.box {
    padding: 15px;
    margin: 10px 0;
    border: 1px solid black;
}

/* CURSORES */
.cursor-default { cursor: default; }
.cursor-pointer { cursor: pointer; }
.cursor-move { cursor: move; }
.cursor-text { cursor: text; }
.cursor-wait { cursor: wait; }
.cursor-not-allowed { cursor: not-allowed; }
.cursor-crosshair { cursor: crosshair; }
.cursor-help { cursor: help; }

</style>
</head>

<body>

<header>
    <h1>22-cursors</h1>
</header>

<a href="../03-css/" class="btn-home">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="black" viewBox="0 0 256 256">
        <path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"/>
    </svg>
</a>

<div class="container">

    <h2>Cursor Examples</h2>

    <div class="box cursor-default">Cursor: default</div>
    <div class="box cursor-pointer">Cursor: pointer (clickable)</div>
    <div class="box cursor-move">Cursor: move</div>
    <div class="box cursor-text">Cursor: text</div>
    <div class="box cursor-wait">Cursor: wait</div>
    <div class="box cursor-not-allowed">Cursor: not-allowed</div>
    <div class="box cursor-crosshair">Cursor: crosshair</div>
    <div class="box cursor-help">Cursor: help</div>

</div>

</body>
</html>
