<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>42 parallax</title>
    <link rel="stylesheet" href="../src/css/03-css.css">
    <style>
        figure.parallax {
            border-radius: 6px;
            height: 576px;
            overflow: hidden;
            position: relative;
            margin: 1rem auto;
            width: calc(1024px / 3);
        }
        figure.parallax div {
            height: 576px;
            position: absolute;
            width: calc(1024px * 2);
        }
        figure.parallax div.layer8 {
            background: url(../src/imgs/parallax/layer_08.png) repeat-x;
            z-index: 1;
        }
        figure.parallax div.layer7 {
            background: url(../src/imgs/parallax/layer_07.png) repeat-x;
            z-index: 2;
            animation: animParallax 70s linear infinite;
        }
        figure.parallax div.layer6 {
            background: url(../src/imgs/parallax/layer_06.png) repeat-x;
            z-index: 3;
            animation: animParallax 60s linear infinite;
        }
        figure.parallax div.layer5 {
            background: url(../src/imgs/parallax/layer_05.png) repeat-x;
            z-index: 4;
            animation: animParallax 50s linear infinite;
        }
        figure.parallax div.layer4 {
            background: url(../src/imgs/parallax/layer_04.png) repeat-x;
            z-index: 5;
            animation: animParallax 40s linear infinite;
        }
        figure.parallax div.layer3 {
            background: url(../src/imgs/parallax/layer_03.png) repeat-x;
            z-index: 6;
            animation: animParallax 30s linear infinite;
        }
        figure.parallax div.layer2 {
            background: url(../src/imgs/parallax/layer_02.png) repeat-x;
            z-index: 7;
            animation: animParallax 20s linear infinite;
        }
        figure.parallax div.layer1 {
            background: url(../src/imgs/parallax/layer_01.png) repeat-x;
            z-index: 8;
            animation: animParallax 10s linear infinite;
        }
        figure.parallax div.runner {
            background: url(../src/imgs/parallax/running.gif) no-repeat center;
            background-size: contain;
            height: 100px;
            left: 50%;
            transform: translateX(-50%);
            bottom: 120px;
            width: 100px;
            z-index: 9;
        }
        @keyframes animParallax {
            100% { background-position: calc(-1024px * 2) }
        }

        @media (min-width: 1200px) {
            body main section {
                width: 1080px;
                figure.parallax {
                    width: 1024px;
                }
            }
        }
    </style>
</head>

<body>
     <a href="../03-css/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="black" viewBox="0 0 256 256">
            <path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"/>
        </svg>
    </a>
    <main>
        <header>
            <h1>01 Document Style</h1>
            <h2>This way we can include CSS within the style tag, it is very useful when you only have an html document.</h2>
        </header>
        <section>
            <h3>Example: Runner</h3>
            <figure class="parallax">
                <div class="layer8"></div>
                <div class="layer7"></div>
                <div class="layer6"></div>
                <div class="layer5"></div>
                <div class="layer4"></div>
                <div class="layer3"></div>
                <div class="layer2"></div>
                <div class="layer1"></div>
                <div class="runner"></div>
            </figure>
        </section>
    </main>
</body>

</html>
