<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16-Float</title>

<link rel="stylesheet" href="/src/css/03-css.css">

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4b0082,#7900c9,#9b30ff);
    color: white;
    min-height: 100vh;
    padding: 40px;
}

main{
    width: 90%;
    max-width: 1100px;
    margin: auto;
}

header{
    text-align: center;
    margin-bottom: 50px;
}

header h1{
    font-size: 50px;
    margin-bottom: 15px;
}

header h2{
    font-size: 24px;
    font-weight: normal;
}

/* CONTENEDOR */

.container{
    width: 700px;
    min-height: 200px;
    border: 4px solid white;
    border-radius: 20px;
    background: rgba(255,255,255,0.1);
    padding: 20px;
    margin: auto;
}

/* CAJAS */

.box{
    width: 100px;
    height: 100px;
    background: white;
    color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    border-radius: 10px;
}

/* FLOAT */

.float-left{
    float: left;
    margin-right: 15px;
}

.float-right{
    float: right;
    margin-left: 15px;
}

/* CLEAR para que el contenedor no colapse */
.clear{
    clear: both;
}

p{
    margin-top: 10px;
    line-height: 1.5;
}

</style>
</head>

<body>
<a href="../03-css/" class="btn-home">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="black" viewBox="0 0 256 256">
        <path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"/>
    </svg>
</a>

<main>

<header>
    <h1>CSS Float</h1>
    <h2>Pushes the element to either the left or right side</h2>
</header>

<div class="container">

    <div class="box float-left">L</div>
    <div class="box float-right">R</div>

    <p>
        Este es un ejemplo de <strong>float</strong>. La caja con la letra "L" está flotando a la izquierda,
        mientras que la caja con la letra "R" está flotando a la derecha. El texto fluye alrededor de
        estos elementos automáticamente.
    </p>

    <div class="clear"></div>

</div>

</main>

</body>
</html>
