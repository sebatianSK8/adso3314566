<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>34 Variables</title>

    <link rel="stylesheet" href="/src/css/03-css.css">

    <style>
        :root {
            --size-step: calc(1024px / 4);
        }

        .bg {
            background: url("../src/imgs/bg-steps.png") no-repeat center/cover;
            width: 380px;
            height: 560px;
            margin: .2rem auto;
            border-radius: 4px;
            position: relative;
        }

        .steps {
            background: url("../src/imgs/steps-all.png") no-repeat;
            width: var(--size-step);
            height: var(--size-step);
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            animation: animSteps .4s steps(4) infinite;
        }

        .front {
            background-position-y: calc(var(--size-step) * 0);
        }

        .left {
            background-position-y: calc(var(--size-step) * -1);
        }

        .right {
            background-position-y: calc(var(--size-step) * -2);
        }

        .back {
            background-position-y: calc(var(--size-step) * -3);
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .3rem;
            padding-top: 1rem;
        }

        .footer {
            display: flex;
            gap: .3rem;
        }

        .controls button {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.4rem;
            background: rgba(255, 255, 255, .6);
            transition: .2s;
        }

        .controls button:hover {
            background: rgba(255, 255, 255, .9);
            transform: scale(1.05);
        }

        @keyframes animSteps {
            100% {
                background-position-x: -1024px;
            }
        }
    </style>
</head>

<body>

    <main>

        <header>
            <h1>40 steps</h1>
            <h2>Allows step-by-step animation of a sprite.</h2>
        </header>

        <a href="../03-css/index.html" class="btn-home">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="32"
                 height="32"
                 fill="black"
                 viewBox="0 0 256 256">
                <path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"/>
            </svg>
        </a>

        <section>

            <div class="bg">

                <div class="steps front"></div>

                <div class="controls">

                    <div class="header">
                        <button class="btnBack">↑</button>
                    </div>

                    <div class="footer">
                        <button class="btnLeft">←</button>
                        <button class="btnFront">↓</button>
                        <button class="btnRight">→</button>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <script>
        const btnFront = document.querySelector(".btnFront");
        const btnBack = document.querySelector(".btnBack");
        const btnLeft = document.querySelector(".btnLeft");
        const btnRight = document.querySelector(".btnRight");
        const steps = document.querySelector(".steps");

        function removeAllClasses() {
            steps.classList.remove("front", "back", "left", "right");
        }

        function changeDirection(direction) {
            removeAllClasses();
            steps.classList.add(direction);
        }

        btnFront.addEventListener("click", () => changeDirection("front"));
        btnBack.addEventListener("click", () => changeDirection("back"));
        btnLeft.addEventListener("click", () => changeDirection("left"));
        btnRight.addEventListener("click", () => changeDirection("right"));

        document.addEventListener("keyup", (e) => {

            const directions = {
                ArrowUp: "back",
                ArrowDown: "front",
                ArrowLeft: "left",
                ArrowRight: "right"
            };

            if (directions[e.key]) {
                changeDirection(directions[e.key]);
            }

        });
    </script>

</body>

</html>
