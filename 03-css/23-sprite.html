<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>23-Sprite</title>

<link rel="stylesheet" href="/src/css/03-css.css">

<style>
.sprite {
    height: 256px;
    width: 256px;
    margin: 1rem auto;
    background-repeat: no-repeat;
}

.runner {
    background-image: url(imgs/anim-sprite.png);
}

.hadoken {
    background-image: url(imgs/game-id.png.png); 
}
.runner.sp1 {background-position: calc(-256px * 0) 0;}
.runner.sp2 {background-position: calc(-256px * 1) 0;}
.runner.sp3 {background-position: calc(-256px * 2) 0;}
.runner.sp4 {background-position: calc(-256px * 3) 0;}
.runner.sp5 {background-position: calc(-256px * 4) 0;}
.runner.sp6 {background-position: calc(-256px * 5) 0;}

.hadoken.sp1 {background-position: calc(-256px * 0) 0;}
.hadoken.sp2 {background-position: calc(-256px * 1) 0;}
.hadoken.sp3 {background-position: calc(-256px * 2) 0;}
</style>
</head>

<body>

<a href="../03-css/" class="btn-home">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="black" viewBox="0 0 256 256">
        <path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"/>
    </svg>
</a>

<main>
    <header>
        <h1>23-Sprite</h1>
        <h2>An image sprite is a collection of images put into a single image.</h2>
    </header>

    <section>
        <h3>Runner</h3>
        <div class="sprite runner sp1"></div>

        <h3>Punch</h3>
        <div class="sprite hadoken sp1"></div>
    </section>
</main>

<script>
const runner = document.querySelector('.runner')
let count1 = 1

setInterval(() => {
    runner.className = 'sprite runner'
    runner.classList.add('sp' + count1)

    count1 = (count1 == 6) ? 1 : count1 + 1
}, 80)


const hadoken = document.querySelector('.hadoken')
let count2 = 1

setInterval(() => {
    hadoken.className = 'sprite hadoken'
    hadoken.classList.add('sp' + count2)

    count2 = (count2 == 3) ? 1 : count2 + 1
}, 200)
</script>

</body>
</html>
